<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: red;
  position: relative;
  animation-name: myAnimation;
  animation-duration: 4s;
  animation-iteration-count: infinite;

}

@keyframes myAnimation {
  0% {background-color: red; left: 0px; top: 0; transform: rotate(36deg)}
  25% {background-color: blueviolet; top: 0px; left: 200px; }
  50% {background-color: greenyellow; left: 200px; top: 200px;}
  75% {background-color: cyan; left: 0px; top: 200px; }
  100% {background-color: red; left: 0; top: 0;}
}
</style>
</head>
<body>

<div></div>

</body>
</html>
