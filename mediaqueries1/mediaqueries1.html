<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width:100vw;
            height:100vh;
            margin: 15px;
            gap:100px;
            display: grid;
            justify-content: center;
            grid-template-columns: repeat(3, 1fr);}
            .card{
             width: 300;
                height: 300px;

                border: 1px solid #ccc;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            @media (max-width: 768px) {
                .grid-container {
                    width: 100%;
                    height: auto;
                    margin: 0;
                    padding: 8px;
                    box-sizing: border-box;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 16px;
                }

                .card {
                    width: 100%;
                    height: auto;
                    aspect-ratio: 4 / 5;
                }
            }

            @media (max-width: 600px) {
                .grid-container {
                    grid-template-columns: 1fr;
                }

                .card {
                    max-width: 400px;
                    margin: 0 auto;
                }
            }
    </style>
</head>
<body>
    <div class="grid-container" ;">
       <div class="card">
            <img src="assets/pic1.jpeg" alt="photo 1">
        </div>
        <div class="card">
            <img src="assets/pic2.jpeg" alt="photo 2">
        </div>
        <div class="card">
            <img src="assets/pic3.jpeg" alt="photo 3">
        </div>
        <div class="card">
            <img src="assets/pic4.jpeg" alt="photo 4">
        </div>
        <div class="card">
            <img src="assets/pic5.jpeg" alt="photo 5">
        </div>
        <div class="card">
            <img src="assets/pic6.jpeg" alt="photo 6">
        </div>
        <div class="card">
            <img src="assets/pic7.jpeg" alt="photo 7">
        </div>
        <div class="card">
            <img src="assets/pic8.png" alt="photo 8">
        </div>
        <div class="card">
            <img src="assets/pic9.jpeg" alt="photo 9">
        </div>

    </div>
</body>
</html>
